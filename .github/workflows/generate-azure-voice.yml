name: Generate Azure AI English voice
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: azure-voice-main
  cancel-in-progress: false
jobs:
  create-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate MP3 audio using Azure Speech Free F0
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
        run: python scripts/generate_azure_speech.py
      - name: Commit generated audio into the site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/azure/
          if git diff --cached --quiet; then
            echo 'No new audio files to save.'
            exit 0
          fi
          git commit -m 'Add Azure AI English course audio'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Automatic rebase conflict; do not force push.'
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'Audio published successfully.'
              exit 0
            fi
            echo "Push retry $attempt/4 after remote update"
          done
          echo 'Push failed after retries.'
          exit 1
