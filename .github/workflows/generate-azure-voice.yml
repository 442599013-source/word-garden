name: Generate Azure AI English voice
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate MP3 audio using Azure Speech Free F0
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: eastus
        run: python scripts/generate_azure_speech.py
      - name: Commit generated audio into the site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/azure/
          if ! git diff --cached --quiet; then
            git commit -m 'Add Azure AI English course audio'
            git push
          fi
