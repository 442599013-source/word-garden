<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>英语随身听</title><link rel="stylesheet" href="walkman.css?v=16"><main><a href="listening.html">‹ 返回听力 · Back</a><h1>英语随身听<small>English Audio Player</small></h1><nav id="types"></nav><section><label>分类 · Category<select id="category"></select></label><label>内容本 · Book<select id="books"></select></label><p id="empty">暂无内容本，请导入或上传内容文件。</p><label class="import">导入内容本 · Import JSON<input id="import" type="file" accept=".json,application/json"></label></section><section><p id="book-title"></p><p id="position"></p><h2 id="english">准备好后，选择一本内容本</h2><p id="chinese"></p><div class="controls"><button id="prev">上一条<br>Previous</button><button id="play">播放<br>Play</button><button id="next">下一条<br>Next</button></div><audio id="audio" controls playsinline></audio><p id="status" role="status"></p></section><section class="settings"><label>每条英中重复 · Repeats<select id="repeat"><option>1</option><option selected>3</option><option>5</option><option>10</option></select></label><label>语速 · Speed<select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><label>循环 · Loop<select id="loop"><option value="book">整本循环 · Book</option><option value="single">单条循环 · Item</option><option value="off">播完停止 · Off</option></select></label><label>定时关闭 · Sleep timer<select id="sleep"><option value="0">不定时 · Off</option><option value="10">10 分钟</option><option value="20">20 分钟</option><option value="30">30 分钟</option><option value="60">60 分钟</option></select></label><label>指定关闭时间 · Stop at<input id="stop-at" type="time"></label><button id="set-timer">设置定时 · Set timer</button><p id="timer-status"></p></section><p id="stats"></p><p class="note">每条先读英文，再读中文。收听统计与闯关分开。锁屏或切到后台后，能否继续播放取决于手机浏览器。</p></main><script src="wm-microsoft-voice.js?v=16"></script><script src="walkman-core.js?v=16"></script><script src="walkman.js?v=16"></script></html>
