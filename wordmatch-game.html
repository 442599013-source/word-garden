<script>

const $=id=>document.getElementById(id), scene=$('scene'),view=$('viewport');let scale=1;
function fit(){

 const vv=window.visualViewport,focused=document.activeElement?.id==='native-input';

 const compression=designHeight/1536;

 scene.style.transform='scale('+scale+')';view.style.height=(designHeight*scale)+'px';
 document.body.classList.toggle('keyboard-open',!!keyboard);
 if(keyboard){view.style.position='absolute';view.style.top=((vv.offsetTop||0)+window.scrollY+4)+'px';view.style.left='0';view.style.right='0';}
 else{view.style.position='relative';view.style.top='';view.style.left='';view.style.right='';}
}window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);window.visualViewport?.addEventListener('scroll',fit);fit();
const key='wm-v42-progress';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){};
let level=Number.isInteger(saved.level)&&saved.level>=0&&saved.level<WORDS.length?saved.level:3;
let completed=new Set(Array.isArray(saved.completed)?saved.completed:[]);let targetIndex=2,input='',busy=false,remainingTimer=null;

// Microsoft Azure voice: text segments played consecutively, with matching locales.
const AZURE_URL='https://wordmatch-voice.442599013.workers.dev/tts';
let audioContext=null, audioQueue=Promise.resolve(),audioSession=0, speechErrorShown=false;
function initVoice(){try{if(!audioContext){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioContext=new AC()}if(audioContext&&audioContext.state==='suspended')audioContext.resume().catch(()=>{})}catch(e){}}

 if(!resp.ok){let detail='';try{detail=(await resp.json()).error||''}catch(e){}throw Error('Azure '+resp.status+(detail?' '+detail:''))}
 const data=await resp.arrayBuffer();if(!data.byteLength)throw Error('Azure 返回空音频');return data;
}
async function playAzure(text,locale,session){if(locale==='zh-CN'||!text||session!==audioSession)return;
 const bytes=await azureAudio(text,locale);if(session!==audioSession)return;
 if(audioContext){if(audioContext.state!=='running')await audioContext.resume();const buffer=await audioContext.decodeAudioData(bytes.slice(0));if(session!==audioSession)return;await new Promise((resolve,reject)=>{const node=audioContext.createBufferSource();node.buffer=buffer;node.connect(audioContext.destination);node.onended=resolve;try{node.start(0)}catch(e){reject(e)}})}

}
function voiceSequence(segments){segments=segments.filter(part=>part[1]==='en-GB'||part[1]==='en-US');initVoice();const id=++audioSession;audioQueue=audioQueue.catch(()=>{}).then(async()=>{for(const part of segments){if(id!==audioSession)break;try{await playAzure(part[0],part[1],id)}catch(e){if(!speechErrorShown){speechErrorShown=true;announce('英文朗读暂时不可用，请稍后重试',2600)};/* preserve queue; do not stop on first failed Chinese clip */}}});}
const grammarNotes={
 am:'am 是 be 动词的第一人称单数形式。',an:'an 用在元音音素开头的单数名词前。',as:'as 可以表示像、如同。',at:'at 表示在某个地点或时间。',be:'be 是系动词原形。',by:'by 表示在旁边，或通过某种方式。',do:'do 表示做。',go:'go 表示去。',he:'he 是第三人称单数男性主格。',hi:'hi 是打招呼用语。',
 mum:'mum 是母亲的口语说法。',dad:'dad 是父亲的口语说法。',boy:'boy 是可数名词，表示男孩。',man:'man 是可数名词，表示男人。',son:'son 是可数名词，表示儿子。',kid:'kid 表示孩子，是非正式表达。',her:'her 可作宾格代词或形容词性物主代词。',him:'him 是 he 的宾格。',she:'she 是女性第三人称单数主格。',you:'you 既可以表示你，也可以表示你们。'
};

const spokenPhrases={
 am:['I am','我是'],an:['an apple','一个苹果'],as:['as tall as','和……一样高'],at:['at home','在家'],be:['be happy','要快乐'],by:['by the sea','在海边'],do:['do homework','做作业'],go:['go home','回家'],he:['he is','他是'],hi:['say hi','打招呼'],
 in:['in the box','在盒子里'],is:['it is','它是'],it:['it is','它是'],me:['help me','帮助我'],my:['my bag','我的包'],no:['no thank you','不，谢谢'],of:['a cup of tea','一杯茶'],on:['on the table','在桌子上'],or:['tea or coffee','茶或咖啡'],to:['go to school','去上学'],
 up:['stand up','站起来'],us:['help us','帮助我们'],we:['we are','我们是'],if:['if you like','如果你愿意'],so:['so nice','如此友好'],ox:['big ox','大公牛'],ex:['my ex','我的前任'],oh:['oh no','哦不'],ok:["OK let's go",'好的，我们走吧'],ah:['ah I see','啊，我明白了'],
 mum:['my mum','我的妈妈'],dad:['my dad','我的爸爸'],boy:['a little boy','一个小男孩'],man:['a tall man','一个高个子男人'],son:['my son','我的儿子'],kid:['a happy kid','一个开心的孩子'],her:['her bag','她的包'],him:['see him','看见他'],she:['she is','她是'],you:['you are','你是']
};
function speakWord(w){const spelling=w.w.split('').map(c=>c.toUpperCase()).join(', ');const note=grammarNotes[w.w]||w.w+' 的用法请结合例句学习。';const phrase=spokenPhrases[w.w]||[w.w,w.zh];
voiceSequence([[w.w,'en-GB'],[w.zh,'zh-CN'],[spelling,'en-GB'],[phrase[0],'en-GB'],[phrase[1],'zh-CN'],[w.en,'en-GB'],[w.cn,'zh-CN'],[note,'zh-CN']]);}

function select(i){if(busy||completed.has(i))return;targetIndex=i;input='';updateTyping();updateTasks();lesson(dataset()[i]);initVoice();}
function updateTasks(){const wrap=$('tasks');wrap.replaceChildren();dataset().forEach((w,i)=>{const b=document.createElement('button');b.type='button';b.className='area word'+(i===targetIndex?' active':'')+(completed.has(i)?' gone':'');b.style.cssText='left:'+((i%5)*147)+'px;top:'+(Math.floor(i/5)*110)+'px;width:139px;height:92px';const strong=document.createElement('b');strong.textContent=w.w;const small=document.createElement('small');small.textContent=w.zh;b.append(strong,small);b.setAttribute('aria-label',w.w+' '+w.zh+(completed.has(i)?' 已完成':''));b.onclick=()=>select(i);if(completed.has(i))b.disabled=true;wrap.appendChild(b)});$('remaining').textContent=dataset().length-completed.size;$('level').textContent='第'+(level+1)+'关'}
function lesson(w){$('wordvalue').textContent=w.w;$('wordzh').textContent=w.zh;$('senten').textContent=w.en;$('sentzh').textContent=w.cn;const t=w.w.length>9?28:w.w.length>6?38:53;$('wordvalue').style.fontSize=t+'px';$('wordzh').style.fontSize=(w.zh.length>5?29:38)+'px';$('senten').style.fontSize=(w.en.length>28?26:36)+'px';$('sentzh').style.fontSize=(w.cn.length>18?23:31)+'px'}
function updateTyping(){if($('native-input').value!==input)$('native-input').value=input;$('typed').textContent=input;$('typed').style.fontSize=(input.length>14?26:input.length>9?37:58)+'px'}
function fly(index){return new Promise(resolve=>{const el=$('tasks').children[index],src=el.getBoundingClientRect(),dst=$('lessonword').getBoundingClientRect(),r=scene.getBoundingClientRect();const f=document.createElement('div');f.className='fly';f.textContent=dataset()[index].w;f.style.left=((src.left-r.left)/scale)+'px';f.style.top=((src.top-r.top)/scale)+'px';scene.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform='translate('+((dst.left-src.left)/scale)+'px,'+((dst.top-src.top)/scale)+'px) scale(.75)';f.style.opacity='.08'}));setTimeout(()=>{f.remove();resolve()},760)})}
async function success(i){if(busy)return;busy=true;initVoice();speakWord(dataset()[i]);await fly(i);completed.add(i);write();lesson(dataset()[i]);updateTasks();input='';updateTyping();announce('✓ '+dataset()[i].w+' 消除成功！');if(completed.size===dataset().length){setTimeout(()=>showWin(),950)}else{setTimeout(()=>{let j=dataset().findIndex((_,k)=>!completed.has(k));targetIndex=j;updateTasks();lesson(dataset()[j]);busy=false},1200)}}
function enter(key){if(busy)return;initVoice();if(key==='BACK'){input=input.slice(0,-1);updateTyping();return}if(key==='SPACE')key=' ';if(input.length>=30)return;input+=key;updateTyping();const exact=dataset().findIndex((w,i)=>!completed.has(i)&&w.w.toLowerCase()===input.toLowerCase());if(exact>=0){const longer=dataset().some((w,i)=>!completed.has(i)&&w.w.length>input.length&&w.w.toLowerCase().startsWith(input.toLowerCase()));if(!longer){targetIndex=exact;updateTasks();success(exact);return}}const prefix=dataset().some((w,i)=>!completed.has(i)&&w.w.toLowerCase().startsWith(input.toLowerCase()));if(!prefix){announce('没有匹配的任务词，请删除重试');}}

const nativeInput=$('native-input');
let composing=false;
function acceptNative(){if(composing)return;if(busy){nativeInput.value=input;return}const value=nativeInput.value.toLowerCase().replace(/[^a-z' -]/g,'').slice(0,30);input='';for(const ch of value){enter(ch);if(busy)break}updateTyping();}

const overlay=$('overlay');$('dialog-action').onclick=()=>{overlay.classList.remove('open');level=(level+1)%WORDS.length;completed.clear();targetIndex=0;input='';busy=false;write();updateTasks();lesson(dataset()[0]);updateTyping()};
function showWin(){busy=false;$('dialog-title').textContent='🎉 恭喜通关！';$('dialog-text').textContent='本关10个单词全部拼写成功，进入下一关！';overlay.classList.add('open')}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(/^[a-z]$/i.test(e.key)){e.preventDefault();enter(e.key.toLowerCase())}else if(e.key==="'"||e.key==='-'){enter(e.key)}else if(e.key==='Backspace'){e.preventDefault();enter('BACK')}else if(e.key===' '){e.preventDefault();enter('SPACE')}});
