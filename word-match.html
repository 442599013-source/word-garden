<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Word Match · 单词消消乐</title><link rel="stylesheet" href="wm-match.css?v=43"><link rel="stylesheet" href="wm-companions.css?v=43"><link rel="stylesheet" href="v41-update.css?v=43"><meta name="wordmatch-version" content="V47-from-V43"><link rel="stylesheet" href="v42-game.css?v=43"><link rel="stylesheet" href="v47-game.css?v=47.1"></head>
<body><main id="match-game" aria-label="Word Match 单词消消乐"><div class="match-stage">
<a class="home-button art-button" href="index.html" aria-label="Home 返回首页"><span>Home<small>返回首页</small></span></a>
<header class="game-title"><strong aria-label="Word Match"><span>W</span><span>o</span><span>r</span><span>d</span> <span>M</span><span>a</span><span>t</span><span>c</span><span>h</span></strong><h1>单词消消乐</h1></header>
<button type="button" id="settings" class="settings-button art-button" aria-label="Settings 设置"></button>
<button type="button" id="choose-level" class="level-button art-button"><strong id="level-number">Level 1</strong><small id="level-chinese">第1关</small></button>
<div class="score-label"><span>Score 分数</span><output id="game-score" aria-label="累计游戏积分">0.0</output></div>
<div class="combo-label"><span>Combo 连消</span><output id="game-combo">×0</output></div>
<section id="board" class="match-board" aria-label="English and Chinese matching board 英汉配对棋盘"></section>
<div class="target-heading">Target Words<small>本关目标单词 <span id="target-progress">0/10</span></small></div>
<section id="targets" class="match-targets" aria-label="Ten target words 本关十个目标词"></section>
<div class="help-heading" id="help-heading">How to Play <small>游戏说明</small></div>
<section id="word-meaning" class="match-message" aria-live="polite"><strong id="feedback-word">Match the pairs</strong><span id="feedback-meaning">英文与中文配对消除</span><div id="matched-pair" class="matched-pair" hidden></div></section>
<nav id="howto-controls" class="howto-controls" aria-label="How to play pages 游戏说明分页"><button type="button" id="howto-prev" aria-label="Previous 上一页">‹</button><span id="howto-page"></span><button type="button" id="howto-next" aria-label="Next 下一页">›</button></nav>
<button type="button" id="hint" class="hint-button art-button"><span>Hint<small>提示</small></span></button>
<button type="button" id="shuffle" class="shuffle-button art-button"><span>New Batch<small>换一批</small></span></button>
<div id="effects" class="match-effects" aria-hidden="true"></div>
<div id="dialog" class="match-dialog-layer" hidden><section class="match-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header><h2 id="dialog-title"></h2><button type="button" id="close-dialog" aria-label="Close 关闭">×</button></header><div id="dialog-content"></div></section></div><audio id="match-audio" playsinline preload="none" hidden></audio>
