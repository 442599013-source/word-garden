<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单词消消乐 · Word Match</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#542399;background:#f0eafe}*{box-sizing:border-box}body{margin:0;padding:12px}.shell{max-width:520px;margin:auto;background:white;border-radius:18px;padding:12px;min-height:90vh}.top{display:flex;align-items:center;gap:5px;white-space:nowrap}.brand{flex:1;min-width:0;cursor:pointer}.brand b{font-size:15px}.en{font-size:11px;color:#8769ab;display:block;margin-top:3px}.counter{background:#fff3fc;border:1px solid #e7cbe9;border-radius:9px;text-align:center;padding:5px 6px;font-size:10px;color:#8552a1}.counter strong{display:block;color:#b05ec8;font-size:19px}.topbutton{background:#eee0ff;border:0;border-radius:9px;padding:7px 6px;color:#7036a6;cursor:pointer;font-size:11px;min-width:55px}.topbutton span{display:block;font-size:17px}.panel{border-radius:16px;padding:14px;margin-top:13px}.pink{background:#fff4f2}.lav{background:#f5efff}.cream{background:#fff0da}.avatarrow{display:flex;justify-content:space-between;align-items:center}.avatar{width:156px;height:156px;border-radius:50%;object-fit:cover;background:#f5d7ee}.arrow{border:0;border-radius:50%;background:#eed8ff;color:#7135b2;width:36px;height:36px;font-size:24px;cursor:pointer}.center{text-align:center}.purple{color:#542399}.sub{color:#9576af;font-size:12px}.level{font-size:23px;font-weight:750;margin:4px}.track{background:#e7d8f4;height:12px;border-radius:12px;overflow:hidden}.fill{height:100%;background:#a65be0;border-radius:12px}.btn{display:block;width:100%;border:1px solid #aa66e5;background:#d9b5ff;color:#4b167f;border-radius:13px;padding:13px 9px;text-align:center;cursor:pointer;font-weight:700;font-size:15px;margin-top:10px}.btn .en{color:#4b167f;font-weight:400}.btn.secondary{background:#e9d7ff;border-color:#e9d7ff}.btn.gold{background:#e8c28c;border-color:#e8c28c;color:#5c3814}.btn.gold .en{color:#765020}.btn:disabled{opacity:.45;cursor:not-allowed}.sectiontitle{font-size:18px;font-weight:750}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.four{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tile{background:white;border:1px solid #e0d0f5;border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;color:#542399}.tile .icon{font-size:25px;color:#8a50d1}.pte{border:1px solid #e6d8f7;background:white;border-radius:12px;padding:12px}.ptebar{height:10px;border-radius:8px;margin:12px 0;background:#e9def4}.small{font-size:12px}.muted{color:#8769ab}.spaced{margin:12px 0}.back{background:white;border:1px solid #ddd0f5;color:#7036a6;border-radius:8px;padding:8px 13px;margin-top:12px;cursor:pointer}.week{background:white;border:0;border-radius:7px;padding:8px 2px;cursor:pointer;color:#542399;min-height:46px}.week.active{background:#dab9ff}.week.exam{background:#ffe3b0}.week small{display:block;font-size:10px;color:#8769ab}.choice{display:block;background:white;border:1px solid #dac4ef;border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}.choice input{accent-color:#8542b9}.result{background:white;border:1px solid #e1d2ef;border-radius:12px;padding:14px;margin-top:10px}.ok{color:#298660}.wrong{color:#c35a62}.vocab{display:grid;grid-template-columns:1fr 1fr;gap:8px}.vocabcol{display:grid;gap:8px}.word{min-height:58px;border:1px solid #cda8eb;background:#f4e9ff;color:#542399;border-radius:10px;font-size:16px;cursor:pointer}.word.zh{background:#fff0e7}.word.sel{background:#d8b5ff}.word.done{background:#e1f6e9;color:#39856b}.input{width:100%;border:1px solid #d8c5ee;border-radius:9px;padding:12px;font-size:15px;min-height:44px}textarea.input{min-height:100px}.tiny{font-size:11px;color:#9576af}.tag{font-size:12px;background:#e9d7ff;border-radius:8px;padding:6px 8px;display:inline-block}.hide{display:none}.flex{display:flex;justify-content:space-between;align-items:center;gap:8px}h3{margin:0 0 4px}p{line-height:1.5}button{font-family:inherit} @media(max-width:365px){body{padding:5px}.shell{padding:8px}.brand b{font-size:13px}.topbutton{min-width:48px;padding:5px 3px}.counter{padding:3px}.avatar{width:140px;height:140px}}
</style></head><body><main class="shell"><header class="top"><div class="brand" onclick="go('home')"><b>单词消消乐</b><span class="en">Word Match</span></div><div class="counter">已消灭单词<strong id="count">0</strong><span class="en">Words Eliminated</span></div><button class="topbutton" onclick="go('login')"><span>♙</span>登录<small class="en">Log In</small></button><button class="topbutton" onclick="go('settings')"><span>⚙</span>设置<small class="en">Settings</small></button></header><div id="main"></div></main><script>
const STAGES=[['幼儿园','Kindergarten',['大班','中班','小班']],['小学','Primary School',['六年级','五年级','四年级','三年级','二年级','一年级']],['初中','Junior High School',['三年级','二年级','一年级']],['高中','Senior High School',['三年级','二年级','一年级']],['大学','University',['二年级','一年级']],['研究生','Postgraduate',['研究生']]];
const TARGETS=[['听力','Listening',58,'#80b8f4','🎧'],['口语','Speaking',76,'#f2a4c8','🎙'],['阅读','Reading',59,'#8dd0a0','📖'],['写作','Writing',69,'#f2c46e','✏']];
const DEMO=[{word:'apple',meaning_zh:'苹果',example_en:'I eat an apple every day.'},{word:'book',meaning_zh:'书',example_en:'This is my book.'},{word:'happy',meaning_zh:'开心的',example_en:'The girl is happy.'},{word:'water',meaning_zh:'水',example_en:'Please drink some water.'}];
const QDEMO=[{skill:'reading',prompt:'I have ___ apple.',options:['a','an','the'],answer:'an',explanation_zh:'Apple 以元音音素开头，单数可数名词前使用 an。'},{skill:'reading',prompt:'Choose the correct sentence.',options:['She are happy.','She is happy.','She am happy.'],answer:'She is happy.',explanation_zh:'She 是第三人称单数，be 动词使用 is。'},{skill:'reading',prompt:'Which word means 水?',options:['Book','Water','Happy'],answer:'Water',explanation_zh:'Water 的意思是水。'}];
let bank={},page='home',gender='girl',stage='幼儿园',grade='小班',week=1,seen=new Set(),matched=new Set(),picked=null,last=null,quiz=[],qi=0,answer='',revealed=false,results=[],examType='weekly',accent='en-AU',speed=.9,practice='reading',unlocked=false;
const el=()=>document.getElementById('main');const en=s=>`<span class="en">${s}</span>`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const button=(zh,english,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${zh}${en(english)}</button>`;
function speak(text){if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音朗读');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(String(text));u.lang=accent;u.rate=speed;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()===accent.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith('en'))||null;speechSynthesis.speak(u)}
function sound(text){return `<button class="back" onclick="speak(decodeURIComponent('${encodeURIComponent(String(text||''))}'))">🔊 播放英文音频 ${en('Play English Audio')}</button>`}
function go(p){page=p;render();window.scrollTo(0,0)}
function back(){return `<button class="back" onclick="go('${page==='lesson'||page==='exam'?'journey':'home'}')">← 返回</button>`}
function currentWeek(){let key=Object.keys(bank).find(k=>k.startsWith(stage+grade+' /')||k.startsWith(stage+grade+' '));return (bank[key]||[]).find(w=>w.week===week)||null}
function weeklyVocab(){return currentWeek()?.vocabulary||DEMO}
function home(){return `<section class="panel pink"><div class="avatarrow"><button class="arrow" onclick="gender=gender==='girl'?'boy':'girl';render()">‹</button><div class="center"><img class="avatar" src="${gender}.png" alt="${gender==='girl'?'女孩':'男孩'}头像"><div class="spaced">${gender==='girl'?'小女孩':'小男孩'}${en(gender==='girl'?'Girl':'Boy')}</div></div><button class="arrow" onclick="gender=gender==='girl'?'boy':'girl';render()">›</button></div><div class="center"><div>当前身份${en('Current Level')}</div><div class="level">幼儿园小班</div><div class="sub">Kindergarten Junior</div></div><div class="spaced flex"><div>升级进度${en('Level Progress')}</div><b>${Math.round(matched.size/Math.max(weeklyVocab().length,1)*100)}%</b></div><div class="track"><div class="fill" style="width:${Math.min(100,matched.size/Math.max(weeklyVocab().length,1)*100)}%"></div></div></section>${button('🚀 进阶之旅','Level Up',"go('journey')")}<section class="panel lav"><div class="sectiontitle">我的PTE成绩与目标</div>${en('My PTE Scores and Goals')}<div class="two spaced">${TARGETS.map(t=>`<div class="pte"><div>${t[4]} <b>${t[0]}</b>${en(t[1])}</div><div class="ptebar" style="background:${t[3]}55"></div><div class="small">当前：待评估${en('Current: Pending')}</div><div class="spaced small"><b>目标：${t[2]}分</b>${en('Target: '+t[2])}</div><div class="small">差距：待计算${en('Gap: Pending')}</div></div>`).join('')}</div></section><div class="two spaced">${[['🗺','成长之旅','Learning Journey','journey'],['☑','刷题中心','Practice Centre','practice'],['▥','PTE能力分析','PTE Ability Analysis','analysis'],['⚙','账号与设置','Account and Settings','settings']].map(x=>`<button class="tile" onclick="go('${x[3]}')"><div class="icon">${x[0]}</div><b>${x[1]}</b>${en(x[2])}</button>`).join('')}</div>`}
function journey(){let st=STAGES.find(s=>s[0]===stage);return `${back()}<h3 class="spaced">成长之旅</h3>${en('Learning Journey')}<div class="three spaced">${STAGES.map(s=>`<button class="tile" style="background:${stage===s[0]?'#e4ceff':'#f8f4ff'}" onclick="stage='${s[0]}';grade='${s[2][s[2].length-1]}';render()">${s[0]}${en(s[1])}</button>`).join('')}</div><section class="panel pink"><b>年级成长阶梯</b>${en('Grade Progression')}${st[2].map(g=>`<button class="tile spaced" style="display:block;width:100%;background:${grade===g?'#e4ceff':'white'}" onclick="grade='${g}';render()">↗　${g}　›</button>`).join('')}</section><section class="panel lav"><b>周课程与练习</b>${en('Weekly Lessons & Practice · 40 Weeks')}<div class="four spaced">${Array.from({length:40},(_,i)=>{let w=i+1;return `<button class="week ${week===w?'active':w===20||w===40?'exam':''}" onclick="week=${w};render()"><b>${w}</b><small>${w===20?'期中':w===40?'期末':'Week'}</small></button>`}).join('')}</div><div class="panel" style="background:white"><b>第${week}周</b>${en('Week '+week)}${currentWeek()?`<div class="tag spaced">已接入该周题库 · Content Available</div>`:`<div class="tag spaced">该周题库待补充 · Content Pending</div>`}${button('单词消消乐','Word Matching Lesson',"startLesson()",'secondary')}${button('本周练习题','Weekly Practice Questions',"startExam('weekly')")}${week===20?button('第20周期中考试','Week 20 Midterm Exam',"startExam('midterm')",'gold'):''}${week===40?button('第40周期末考试','Week 40 Final Exam',"startExam('final')",'gold'):''}</div></section><section class="panel cream"><h3>🎓 进阶考试</h3>${en('Level Advancement Exam')}<p>完成当前年级40周学习与考试后，通过进阶考试解锁下一年级。</p><p class="sub">Pass the advancement exam to unlock the next grade.</p>${button('进入进阶考试','Start Advancement Exam',"startExam('advancement')",'gold')}${unlocked?'<p class="ok">✓ 示范进阶考试已通过</p>':''}</section>`}
function startLesson(){matched=new Set();picked=null;last=null;go('lesson')}
function lesson(){let vocab=weeklyVocab().slice(0,12);let shuffled=[...vocab].sort((a,b)=>a.word.localeCompare(b.word));return `${back()}<h3 class="spaced">单词配对消除</h3>${en('Word Matching Game')}<section class="panel lav"><div class="flex"><span>第${week}周</span><b>${matched.size} / ${vocab.length}</b></div><div class="track spaced"><div class="fill" style="width:${matched.size/vocab.length*100}%"></div></div></section><p>点击英文和对应的中文，让方块消失。${en('Match English and Chinese tiles to eliminate them.')}</p><div class="vocab"><div class="vocabcol">${vocab.map(w=>`<button class="word ${matched.has(w.word)?'done':picked?.word===w.word&&picked?.side==='en'?'sel':''}" onclick="pick('${encodeURIComponent(w.word)}','en')">${matched.has(w.word)?'✓':esc(w.word)}</button>`).join('')}</div><div class="vocabcol">${shuffled.map(w=>`<button class="word zh ${matched.has(w.word)?'done':picked?.word===w.word&&picked?.side==='zh'?'sel':''}" onclick="pick('${encodeURIComponent(w.word)}','zh')">${matched.has(w.word)?'✓':esc(w.meaning_zh)}</button>`).join('')}</div></div>${last?`<section class="panel pink"><h3>${esc(last.word)}</h3>${esc(last.meaning_zh)}${sound(last.word)}<p><b>${esc(last.example_en)}</b></p>${sound(last.example_en)}<b>语法讲解</b>${en('Grammar Explanation')}<p>${esc(currentWeek()?.grammar||'结合例句学习词义、词性与句子结构。')}</p></section>`:''}${matched.size===vocab.length?`<section class="panel" style="background:#e1f6e9">🏆 全部消除成功！${en('All Words Matched!')}${button('本周练习题','Weekly Practice Questions',"startExam('weekly')")}</section>`:''}${button('重新练习','Try Again',"startLesson()",'secondary')}`}
function pick(encoded,side){let word=decodeURIComponent(encoded);if(matched.has(word))return;if(!picked||picked.side===side){picked={word,side};render();return;}if(picked.word===word){matched.add(word);seen.add(stage+grade+':'+word);last=weeklyVocab().find(w=>w.word===word);speak(word)}picked=null;render()}
function normalize(s){return String(s||'').trim().toLowerCase().replace(/[.!?,]/g,'').replace(/\s+/g,' ')}
function transform(q){let skill=q.skill||'reading';return {skill,prompt:q.prompt||q.instruction_en||'',options:q.options||null,answer:q.answer||q.sample_answer||'',audio:q.audio_script||'',explanation:q.explanation_zh||q.rubric||'请对照正确答案检查。',instruction:q.instruction_en||'',open:!q.options,source:q}}
function startExam(type){examType=type;let w=currentWeek();let stagekey=Object.keys(bank).find(k=>k.startsWith(stage+grade+' /')||k.startsWith(stage+grade+' '));let weeks=bank[stagekey]||[];let pool=type==='weekly'?(w?.practice_exams||[]):type==='midterm'?weeks.filter(x=>x.week<=20).flatMap(x=>x.practice_exams||[]):weeks.flatMap(x=>x.practice_exams||[]);quiz=pool.length?pool.slice(0,type==='weekly'?12:20).map(transform):QDEMO.map(transform);qi=0;answer='';revealed=false;results=[];go('exam')}
function examTitle(){return ({weekly:'本周练习题',midterm:'期中考试',final:'期末考试',advancement:'进阶考试'})[examType]}
function examEn(){return ({weekly:'Weekly Practice Questions',midterm:'Midterm Exam',final:'Final Exam',advancement:'Level Advancement Exam'})[examType]}
function answerUI(q){if(q.options)return q.options.map((x,i)=>`<label class="choice"><input type="radio" name="answer" value="${esc(x)}" ${answer===x?'checked':''} ${revealed?'disabled':''} onchange="answer=this.value"> ${String.fromCharCode(65+i)}. ${esc(x)}</label>`).join('');if(q.skill==='speaking')return `<p>${esc(q.prompt)}</p>${sound(q.prompt)}<button class="back" onclick="recordSpeech()">🎙 开始录音 / Stop Recording</button><div id="recordStatus" class="tiny">录音需浏览器授权；此版本不提供自动发音评分。</div>`;return `<textarea class="input" placeholder="Type your answer in English..." ${revealed?'disabled':''} oninput="answer=this.value">${esc(answer)}</textarea>`}
let recorder=null,recordChunks=[];
async function recordSpeech(){let status=document.getElementById('recordStatus');if(recorder?.state==='recording'){recorder.stop();return}try{let stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);recordChunks=[];recorder.ondataavailable=e=>recordChunks.push(e.data);recorder.onstop=()=>{let blob=new Blob(recordChunks,{type:recorder.mimeType});let url=URL.createObjectURL(blob);status.innerHTML=`<audio controls src="${url}"></audio><div>录音已完成，请自行对照原文。</div>`;stream.getTracks().forEach(t=>t.stop())};recorder.start();status.textContent='正在录音，再次点击按钮结束录音。'}catch(e){status.textContent='录音不可用：请使用 HTTPS 或 localhost，并允许麦克风权限。'}}
function submitQuestion(){let q=quiz[qi];if(!q)return;let valid=q.skill==='speaking'?null:normalize(answer)===normalize(q.answer);results.push(valid);revealed=true;render()}
function nextQuestion(){qi++;answer='';revealed=false;render()}
function exam(){if(qi>=quiz.length){let score=results.filter(x=>x===true).length;return `${back()}<section class="panel" style="background:#e1f6e9;text-align:center"><div style="font-size:30px">🏆</div><h2>${score} / ${quiz.length}</h2><b>本次答题完成</b>${en('Practice Completed')}<p class="tiny">开放题与口语题未自动评分，分数只统计可客观判分的题目。</p>${examType==='advancement'&&score>=Math.ceil(quiz.length*.75)?button('示范解锁 · 返回成长之旅','Demo Unlock',"unlocked=true;go('journey')") :''}${button('重新练习','Try Again',`startExam('${examType}')`,'secondary')}${button('返回成长之旅','Learning Journey',"go('journey')",'secondary')}</section>`}let q=quiz[qi];return `${back()}<h3 class="spaced">${examTitle()}</h3>${en(examEn())}<section class="panel lav"><div class="flex"><b>第 ${qi+1} / ${quiz.length} 题</b><span class="sub">Question ${qi+1} of ${quiz.length}</span></div><div class="track spaced"><div class="fill" style="width:${qi/quiz.length*100}%"></div></div></section><section class="panel pink"><b>${esc(q.instruction||q.prompt||'Choose the correct answer.')}</b>${q.prompt&&q.instruction&&q.prompt!==q.instruction?`<p>${esc(q.prompt)}</p>`:''}${q.audio?sound(q.audio):''}${answerUI(q)}</section>${!revealed?button('提交本题 · 揭晓答案','Submit & Reveal Answer',"submitQuestion()"): `<section class="result"><b class="${results[qi]===true?'ok':results[qi]===false?'wrong':'purple'}">${results[qi]===true?'✓ 回答正确！ Correct!':results[qi]===false?'✕ 回答错误 Incorrect':'答案对照 · Self Review'}</b><p><b>正确答案：</b>${esc(q.answer||q.audio||q.prompt||'开放式口语作答')}</p>${q.audio?`<p>听力原文：${esc(q.audio)}</p>${sound(q.audio)}`:''}<hr style="border:0;border-top:1px solid #e1d2ef"><b>答案解析</b>${en('Answer Explanation')}<p>${esc(q.explanation)}</p></section>${button(qi===quiz.length-1?'完成考试':'下一题',qi===quiz.length-1?'Finish':'Next Question',"nextQuestion()")}`}`}
function practicePage(){return `${back()}<h3 class="spaced">刷题中心</h3>${en('Practice Centre')}<div class="four spaced">${[['listening','听力','Listening'],['speaking','口语','Speaking'],['reading','阅读','Reading'],['writing','写作','Writing']].map(s=>`<button class="tile" style="background:${practice===s[0]?'#e4ceff':'#f5efff'}" onclick="practice='${s[0]}';render()">${s[1]}${en(s[2])}</button>`).join('')}</div><section class="panel pink"><b>${({listening:'听力填空',speaking:'朗读句子',reading:'阅读理解',writing:'写作练习'})[practice]}</b>${en(({listening:'Listening Fill in the Blanks',speaking:'Read Aloud',reading:'Reading Comprehension',writing:'Writing Practice'})[practice])}${practice==='listening'?`<p>请听音频后输入听到的句子。</p>${sound('I eat an apple every day.')}<textarea class="input" id="pAnswer"></textarea>${button('揭晓答案','Reveal Answer',"document.getElementById('pFeedback').innerHTML='正确答案：I eat an apple every day.'")}`:practice==='speaking'?`<p>This is my favourite book.</p>${sound('This is my favourite book.')}<button class="back" onclick="recordSpeech()">🎙 开始 / 停止录音</button><div id="recordStatus" class="tiny">浏览器授权后可录音，不提供自动评分。</div>`:practice==='reading'?`<p>Anna has a red apple. She eats it after school.</p><b>What colour is Anna's apple?</b><div class="spaced"><select class="input" id="pAnswer"><option>Red</option><option>Blue</option><option>Green</option></select></div>${button('揭晓答案','Reveal Answer',"document.getElementById('pFeedback').innerHTML='正确答案：Red.'")}`:`<p>Write two sentences about your favourite book.</p><textarea class="input"></textarea><p class="tiny">写作评分尚未接入。</p>`}<div id="pFeedback" class="spaced"></div></section>`}
function analysis(){return `${back()}<h3 class="spaced">PTE能力分析</h3>${en('PTE Ability Analysis')}${TARGETS.map(t=>`<section class="panel lav"><div class="flex"><div><b>${t[0]}</b>${en(t[1])}</div><div>目标 ${t[2]}${en('Target '+t[2])}</div></div><div class="track spaced"></div><span class="small muted">当前成绩与差距：待评估</span>${en('Current Score and Gap: Pending')}</section>`).join('')}<p class="tiny">当前没有真实PTE成绩，不生成虚假分析。</p>`}
function settings(){return `${back()}<h3 class="spaced">账号与设置</h3>${en('Account and Settings')}<section class="panel lav"><b>英文发音口音</b>${en('English Accent')}${[['en-AU','澳大利亚英语 Australian English'],['en-GB','英国英语 British English'],['en-US','美国英语 American English']].map(x=>`<label class="choice"><input type="radio" name="accent" ${accent===x[0]?'checked':''} onchange="accent='${x[0]}'"> ${x[1]}</label>`).join('')}<hr style="border:0;border-top:1px solid #e1d2ef"><div class="flex"><b>语音速度${en('Speech Speed')}</b><b id="speedValue">${speed.toFixed(1)}×</b></div><input style="width:100%" type="range" min="0.5" max="1.5" step="0.1" value="${speed}" oninput="speed=+this.value;document.getElementById('speedValue').textContent=speed.toFixed(1)+'×'">${sound('Hello! Welcome to Word Match.')}<p class="tiny">使用浏览器语音合成，声音取决于设备已安装的语音。</p><button class="tile spaced" style="width:100%" onclick="go('login')">账号管理 ${en('Account Management')}</button></section>`}
function login(){return `${back()}<h3 class="spaced">登录账号</h3>${en('Log In')}<section class="panel lav"><b>电子邮箱 Email</b><input class="input spaced" type="email" placeholder="name@example.com"><button class="btn" disabled>邮箱登录${en('Email Sign-In')}</button><button class="btn secondary" disabled>Google 登录${en('Google Sign-In')}</button><p class="tiny">账号验证和云同步尚未连接。</p></section>`}
function render(){document.getElementById('count').textContent=seen.size;el().innerHTML=({home,journey,lesson,exam,practice:practicePage,analysis,settings,login})[page]();}
